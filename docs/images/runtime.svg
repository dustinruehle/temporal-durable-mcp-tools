<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" role="img" aria-labelledby="t d">
  <title id="t">What runs in the demo: one box per process, with its terminal, port and make target</title>
  <desc id="d">T7 is the dashboard, which starts agent runs and holds the demo controls. T6 is the agent platform, which makes one MCP tool call to T5, the MCP tool interface. In Temporal mode, T5 starts a Workflow on T1, the Temporal Service. T4, the Python tool Worker, and the Java Worker inside T3 poll Temporal and call the heritage services: T2 for records, policy and notify, and the ledger HTTP API inside T3. In direct mode, T5 calls the heritage services itself.</desc>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1724"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a6478"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b1724; }
      .t { font-size: 15px; font-weight: 700; }
      .tag { font-size: 12px; font-weight: 700; fill: #fff; }
      .s { font-size: 12.5px; fill: #4a4458; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #4a4458; }
      .lbl { font-size: 12.5px; fill: #1b1724; font-weight: 600; }
      .ctl { font-size: 12px; fill: #6a6478; font-style: italic; }
      .dir { font-size: 12px; fill: #c2410c; font-style: italic; }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="680" rx="16" fill="#ffffff"/>

  <!-- T7 Dashboard -->
  <rect x="330" y="20" width="320" height="86" rx="12" fill="#f3f2f6" stroke="#4a4458" stroke-width="2"/>
  <rect x="344" y="32" width="34" height="22" rx="6" fill="#4a4458"/><text x="361" y="48" class="tag" text-anchor="middle">T7</text>
  <text x="388" y="49" class="t">Dashboard</text><text x="478" y="49" class="m">:8095 · make dashboard</text>
  <text x="344" y="72" class="s">Python. You click a beat here. It plays the user or</text>
  <text x="344" y="90" class="s">upstream app and holds the demo controls.</text>

  <!-- T6 Agent platform -->
  <rect x="20" y="180" width="280" height="104" rx="12" fill="#e9f6ee" stroke="#1f8a4c" stroke-width="2"/>
  <rect x="34" y="192" width="34" height="22" rx="6" fill="#1f8a4c"/><text x="51" y="208" class="tag" text-anchor="middle">T6</text>
  <text x="78" y="209" class="t">Agent platform</text>
  <text x="34" y="232" class="m">:9300 · make platform</text>
  <text x="34" y="252" class="s">Python, plain LangGraph, no Temporal:</text>
  <text x="34" y="270" class="s">intake, evaluate, review, one tool call</text>

  <!-- T5 MCP -->
  <rect x="350" y="180" width="280" height="104" rx="12" fill="#fdeee4" stroke="#c2410c" stroke-width="2"/>
  <rect x="364" y="192" width="34" height="22" rx="6" fill="#c2410c"/><text x="381" y="208" class="tag" text-anchor="middle">T5</text>
  <text x="408" y="209" class="t">MCP tool interface</text>
  <text x="364" y="232" class="m">:9200/mcp · make mcp-server</text>
  <text x="364" y="252" class="s">TypeScript. Tool fulfill_request.</text>
  <text x="364" y="270" class="s">Mode switch: direct or temporal.</text>

  <!-- T1 Temporal -->
  <rect x="700" y="180" width="264" height="104" rx="12" fill="#f1ecfc" stroke="#5b2bc4" stroke-width="2"/>
  <rect x="712" y="192" width="34" height="22" rx="6" fill="#5b2bc4"/><text x="729" y="208" class="tag" text-anchor="middle">T1</text>
  <text x="756" y="209" class="t">Temporal Service</text>
  <text x="712" y="232" class="m">:7233, UI :8233 · make server</text>
  <text x="712" y="252" class="s">Dev server, or Temporal Cloud</text>
  <text x="712" y="270" class="s">(then no T1). Event History.</text>

  <!-- request path -->
  <line x1="380" y1="106" x2="200" y2="177" stroke="#1b1724" stroke-width="2" marker-end="url(#k)"/>
  <text x="56" y="142" class="lbl">1 start an agent run</text>
  <line x1="300" y1="226" x2="347" y2="226" stroke="#1b1724" stroke-width="2" marker-end="url(#k)"/>
  <text x="303" y="218" class="lbl">2 MCP</text>
  <line x1="630" y1="226" x2="697" y2="226" stroke="#1b1724" stroke-width="2" marker-end="url(#k)"/>
  <text x="636" y="216" class="lbl">3 start</text>
  <text x="636" y="244" class="s">Workflow</text>

  <!-- T4 tool Worker -->
  <rect x="520" y="370" width="230" height="118" rx="12" fill="#f1ecfc" stroke="#5b2bc4" stroke-width="2" stroke-dasharray="0"/>
  <rect x="534" y="382" width="34" height="22" rx="6" fill="#5b2bc4"/><text x="551" y="398" class="tag" text-anchor="middle">T4</text>
  <text x="578" y="399" class="t">Tool Worker</text>
  <text x="534" y="422" class="m">make tool-worker</text>
  <text x="534" y="442" class="s">Python. FulfillRequest Workflow;</text>
  <text x="534" y="460" class="s">records, policy, notify Activities.</text>
  <text x="534" y="478" class="s">Policy: at most 3 at once.</text>

  <!-- T3 Java process -->
  <rect x="770" y="370" width="190" height="290" rx="12" fill="#fbe9ec" stroke="#b42335" stroke-width="2"/>
  <rect x="784" y="382" width="34" height="22" rx="6" fill="#b42335"/><text x="801" y="398" class="tag" text-anchor="middle">T3</text>
  <text x="828" y="399" class="t">heritage-java</text>
  <text x="784" y="422" class="m">make heritage-java</text>
  <rect x="784" y="436" width="162" height="84" rx="10" fill="#f1ecfc" stroke="#5b2bc4" stroke-width="1.5"/>
  <text x="865" y="458" class="lbl" text-anchor="middle">Java Worker</text>
  <text x="865" y="478" class="s" text-anchor="middle">PlaceHold, CommitHold,</text>
  <text x="865" y="496" class="s" text-anchor="middle">ReleaseHold Activities</text>
  <text x="865" y="512" class="m" text-anchor="middle">heritage-ledger</text>
  <rect x="784" y="572" width="162" height="72" rx="10" fill="#fff" stroke="#b42335" stroke-width="1.5"/>
  <text x="865" y="596" class="lbl" text-anchor="middle">Ledger HTTP API</text>
  <text x="865" y="616" class="m" text-anchor="middle">:9103</text>
  <text x="865" y="634" class="s" text-anchor="middle">place, commit, release</text>
  <line x1="865" y1="520" x2="865" y2="569" stroke="#1b1724" stroke-width="2" marker-end="url(#k)"/>

  <!-- Workers poll Temporal -->
  <line x1="690" y1="367" x2="780" y2="287" stroke="#5b2bc4" stroke-width="2" marker-end="url(#k)"/>
  <line x1="865" y1="433" x2="865" y2="287" stroke="#5b2bc4" stroke-width="2" marker-end="url(#k)"/>
  <text x="668" y="326" class="lbl" text-anchor="end">4 poll, complete</text>
  <text x="668" y="342" class="s" text-anchor="end">(outbound from Workers)</text>

  <!-- T2 heritage-py -->
  <rect x="380" y="572" width="300" height="88" rx="12" fill="#fbe9ec" stroke="#b42335" stroke-width="2"/>
  <rect x="394" y="584" width="34" height="22" rx="6" fill="#b42335"/><text x="411" y="600" class="tag" text-anchor="middle">T2</text>
  <text x="438" y="601" class="t">heritage-py</text><text x="526" y="601" class="m">:9101 · make heritage-py</text>
  <text x="394" y="626" class="s">Python. Records, policy (3 in flight, then 429),</text>
  <text x="394" y="644" class="s">notify. Existing systems, mocked.</text>
  <line x1="600" y1="488" x2="560" y2="569" stroke="#1b1724" stroke-width="2" marker-end="url(#k)"/>
  <text x="594" y="522" class="lbl">5 Activities call</text>
  <text x="594" y="538" class="lbl">the services</text>

  <!-- Direct mode -->
  <path d="M 440 284 L 440 569" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#o)"/>
  <path d="M 480 284 L 480 558 L 758 558 L 758 608 L 781 608" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#o)"/>
  <text x="430" y="320" class="dir" text-anchor="end">direct mode (today):</text>
  <text x="430" y="336" class="dir" text-anchor="end">the MCP server calls the</text>
  <text x="430" y="352" class="dir" text-anchor="end">services itself, no Temporal</text>

  <!-- Demo controls from the dashboard -->
  <line x1="520" y1="106" x2="520" y2="177" stroke="#6a6478" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="526" y="146" class="ctl">mode switch</text>
  <path d="M 640 106 C 700 130, 760 140, 800 177" fill="none" stroke="#6a6478" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="700" y="122" class="ctl">Approve, Reject (Update);</text>
  <text x="700" y="138" class="ctl">progress (Query)</text>
  <path d="M 330 60 L 14 60 L 14 616 L 377 616" fill="none" stroke="#6a6478" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="24" y="584" class="ctl">fault switches and stats</text>
  <text x="24" y="600" class="ctl">(heritage-py and the ledger)</text>

  <!-- Legend -->
  <g transform="translate(30,420)">
    <rect x="0" y="0" width="300" height="104" rx="10" fill="#fafafb" stroke="#e3dfea"/>
    <line x1="14" y1="24" x2="54" y2="24" stroke="#1b1724" stroke-width="2" marker-end="url(#k)"/>
    <text x="64" y="28" class="s">the request path (Temporal mode)</text>
    <line x1="14" y1="52" x2="54" y2="52" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#o)"/>
    <text x="64" y="56" class="s">direct mode: today's way, for contrast</text>
    <line x1="14" y1="80" x2="54" y2="80" stroke="#6a6478" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#g)"/>
    <text x="64" y="84" class="s">demo controls, not part of the design</text>
  </g>
</svg>
