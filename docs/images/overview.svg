<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 596" width="960" height="596" role="img" aria-labelledby="t d">
  <title id="t">A durable execution layer behind the MCP tool interface</title>
  <desc id="d">The agent platform makes one MCP tool call. Behind the tool interface, Temporal runs the work across the heritage systems with retries, crash recovery, queuing, undo and a wait for a person. The heritage systems keep their existing APIs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4458"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b2bc4"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b1724; }
      .h { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
      .s { font-size: 13px; fill: #4a4458; }
      .b { font-size: 14px; font-weight: 600; }
      .c { font-size: 13px; font-weight: 600; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
      .note { font-size: 13px; font-style: italic; fill: #4a4458; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="596" rx="16" fill="#ffffff"/>

  <!-- Agent platform -->
  <rect x="40" y="24" width="640" height="132" rx="12" fill="#e9f6ee" stroke="#1f8a4c" stroke-width="2"/>
  <text x="60" y="52" class="h" fill="#1f8a4c" style="fill:#1f8a4c">AGENT PLATFORM</text>
  <text x="236" y="52" class="s">plain LangGraph, no Temporal</text>
  <rect x="60" y="72" width="120" height="40" rx="20" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="120" y="97" class="b" text-anchor="middle">intake</text>
  <rect x="210" y="72" width="120" height="40" rx="20" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="270" y="97" class="b" text-anchor="middle">evaluate</text>
  <rect x="360" y="72" width="120" height="40" rx="20" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="420" y="97" class="b" text-anchor="middle">review</text>
  <rect x="510" y="72" width="150" height="40" rx="20" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="585" y="97" class="b" text-anchor="middle">one tool call</text>
  <line x1="180" y1="92" x2="207" y2="92" stroke="#4a4458" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="330" y1="92" x2="357" y2="92" stroke="#4a4458" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="92" x2="507" y2="92" stroke="#4a4458" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="60" y="140" class="note">The agent sees one tool: fulfill_request.</text>

  <!-- MCP call -->
  <line x1="585" y1="112" x2="585" y2="190" stroke="#4a4458" stroke-width="2" marker-end="url(#a)"/>
  <text x="597" y="160" class="s">MCP</text>

  <!-- Tool interface + durable execution layer -->
  <rect x="40" y="192" width="640" height="186" rx="12" fill="#f1ecfc" stroke="#5b2bc4" stroke-width="2"/>
  <rect x="40" y="192" width="640" height="44" rx="12" fill="#fdeee4" stroke="#c2410c" stroke-width="2"/>
  <text x="60" y="220" class="h" style="fill:#c2410c">TOOL INTERFACE</text>
  <text x="208" y="220" class="s">MCP server: starts one Workflow per tool call (request id = Workflow Id)</text>
  <text x="60" y="264" class="h" style="fill:#5b2bc4">DURABLE EXECUTION LAYER: TEMPORAL</text>
  <text x="60" y="284" class="s">A Workflow runs the steps across the systems and records each one in Event History.</text>
  <g>
    <rect x="60" y="300" width="140" height="30" rx="15" fill="#fff" stroke="#5b2bc4"/>
    <text x="130" y="320" class="c" text-anchor="middle">retry each step</text>
    <rect x="212" y="300" width="168" height="30" rx="15" fill="#fff" stroke="#5b2bc4"/>
    <text x="296" y="320" class="c" text-anchor="middle">resume after a crash</text>
    <rect x="392" y="300" width="138" height="30" rx="15" fill="#fff" stroke="#5b2bc4"/>
    <text x="461" y="320" class="c" text-anchor="middle">queue the work</text>
    <rect x="542" y="300" width="118" height="30" rx="15" fill="#fff" stroke="#5b2bc4"/>
    <text x="601" y="320" class="c" text-anchor="middle">undo (saga)</text>
    <rect x="60" y="338" width="190" height="30" rx="15" fill="#fff" stroke="#5b2bc4"/>
    <text x="155" y="358" class="c" text-anchor="middle">wait for a person</text>
    <rect x="262" y="338" width="200" height="30" rx="15" fill="#fff" stroke="#5b2bc4"/>
    <text x="362" y="358" class="c" text-anchor="middle">add Workers to scale</text>
  </g>

  <!-- Person (HITL) -->
  <rect x="740" y="250" width="180" height="96" rx="12" fill="#fff" stroke="#5b2bc4" stroke-width="2"/>
  <text x="830" y="282" class="b" text-anchor="middle">A person</text>
  <text x="830" y="304" class="s" text-anchor="middle">approves or rejects</text>
  <text x="830" y="324" class="s" text-anchor="middle">mid-call, with a deadline</text>
  <line x1="737" y1="298" x2="684" y2="298" stroke="#5b2bc4" stroke-width="2" marker-end="url(#ap)"/>
  <text x="830" y="372" class="note" text-anchor="middle">nothing runs while they decide</text>

  <!-- The line the quirks stay below -->
  <line x1="24" y1="186" x2="936" y2="186" stroke="#4a4458" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="936" y="178" class="note" text-anchor="end">How the systems behave stays below this line.</text>

  <!-- Calls to heritage systems -->
  <line x1="150" y1="378" x2="150" y2="436" stroke="#4a4458" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="378" x2="360" y2="436" stroke="#4a4458" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="378" x2="570" y2="436" stroke="#4a4458" stroke-width="2" marker-end="url(#a)"/>
  <text x="162" y="420" class="s">Activities</text>

  <!-- Heritage systems -->
  <rect x="40" y="440" width="640" height="136" rx="12" fill="#fbe9ec" stroke="#b42335" stroke-width="2"/>
  <text x="60" y="472" class="h" style="fill:#b42335">HERITAGE SYSTEMS</text>
  <text x="246" y="472" class="s">existing APIs, unchanged</text>
  <rect x="70" y="490" width="160" height="62" rx="10" fill="#fff" stroke="#b42335" stroke-width="1.5"/>
  <text x="150" y="516" class="b" text-anchor="middle">records</text>
  <text x="150" y="536" class="s" text-anchor="middle">called from Python</text>
  <rect x="280" y="490" width="160" height="62" rx="10" fill="#fff" stroke="#b42335" stroke-width="1.5"/>
  <text x="360" y="516" class="b" text-anchor="middle">policy</text>
  <text x="360" y="536" class="s" text-anchor="middle">3 calls in flight at most</text>
  <rect x="490" y="490" width="160" height="62" rx="10" fill="#fff" stroke="#b42335" stroke-width="1.5"/>
  <text x="570" y="516" class="b" text-anchor="middle">ledger</text>
  <text x="570" y="536" class="s" text-anchor="middle">called from Java</text>

  <text x="740" y="470" class="note">Each team keeps its own</text>
  <text x="740" y="490" class="note">service and language.</text>
</svg>
