[project]
name = "temporal-durable-mcp-tools"
version = "0.1.0"
description = "Durable MCP tools: a plain LangGraph agent platform calls composite tools that Temporal orchestrates across heritage services in Python and Java."
requires-python = ">=3.11"
dependencies = [
  "temporalio==1.34.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "langgraph>=1.2,<2",
  "langchain-core>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-mcp-adapters>=0.3,<0.4",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "heritage/python/heritage_py",
  "tools/python/durable_tools",
  "agent-platform/agent_platform",
  "dashboard/demo_dashboard",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
